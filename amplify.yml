version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install "$(cat .nvmrc)"
        - nvm use "$(cat .nvmrc)"
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*