<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiroLogo</title>
  <link rel="stylesheet" href="./src/estilos/tema.css">
  <link rel="stylesheet" href="./src/estilos/pantalla.css">
</head>
<body>
  <!--
    Contrato con main.ts (Opción A): la capa ui/ construye su propio DOM con
    clases kl-* y lo agrega como HIJO DIRECTO de #aplicacion (el contenedor):
    editor, panel de comandos, globo, comparación y controles. Este HTML aporta
    los elementos estáticos: la región aria-live, la cabecera y los canvas con
    los ids que main.ts busca por getElementById.

    Layout de tres columnas (ver pantalla.css): lienzo de Kiro a la izquierda,
    la sección del programa (globo, editor, panel, controles) al centro, y el
    lienzo del jugador a la derecha. Como main.ts localiza los canvas por id,
    los tres bloques pueden vivir sueltos y colocarse por su clase.
  -->
  <div id="aplicacion" role="application" aria-label="KiroLogo, juego para aprender pensamiento algorítmico">

    <!-- Región aria-live: único canal de anuncios para lectores de pantalla -->
    <div id="anuncios" class="region-anuncios" aria-live="polite" aria-atomic="true"></div>

    <header class="kl-cabecera">
      <h1 class="kl-titulo">KiroLogo</h1>
    </header>

    <!-- Columna izquierda: lienzo de Kiro (referencia) -->
    <div class="kl-lienzo kl-lienzo-referencia">
      <h2 class="kl-lienzo-titulo">Figura de Kiro</h2>
      <div class="kl-lienzo-cuadro">
        <canvas id="lienzo-fondo-referencia" class="kl-capa" width="800" height="800" aria-hidden="true"></canvas>
        <canvas id="lienzo-referencia" class="kl-capa" width="800" height="800" role="img" aria-label="Figura de Kiro">
          Tu navegador no soporta canvas.
        </canvas>
        <canvas id="lienzo-personajes-referencia" class="kl-capa" width="800" height="800" aria-hidden="true"></canvas>
      </div>
    </div>

    <!-- Columna derecha: lienzo del jugador -->
    <div class="kl-lienzo kl-lienzo-jugador">
      <h2 class="kl-lienzo-titulo">Tu figura</h2>
      <div class="kl-lienzo-cuadro">
        <canvas id="lienzo-fondo-jugador" class="kl-capa" width="800" height="800" aria-hidden="true"></canvas>
        <canvas id="lienzo-jugador" class="kl-capa" width="800" height="800" role="img" aria-label="Tu figura">
          Tu navegador no soporta canvas.
        </canvas>
        <canvas id="lienzo-personajes-jugador" class="kl-capa" width="800" height="800" aria-hidden="true"></canvas>
      </div>
    </div>

    <!-- Superposición: la comparación la muestra u oculta (se dibuja sobre el jugador) -->
    <div class="kl-lienzo kl-lienzo-superposicion" hidden>
      <div class="kl-lienzo-cuadro">
        <canvas id="lienzo-superposicion" class="kl-capa" width="800" height="800" role="img" aria-label="Figuras superpuestas">
          Tu navegador no soporta canvas.
        </canvas>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </div>
</body>
</html>
